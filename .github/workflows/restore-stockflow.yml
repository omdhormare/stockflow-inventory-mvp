name: Restore StockFlow source
on:
  push:
    branches: [main]
    paths:
      - "stockflow-payload/**"
      - ".github/workflows/restore-stockflow.yml"

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore the project tree
        shell: bash
        run: |
          set -euo pipefail
          cat stockflow-payload/00.b64 stockflow-payload/01.b64 stockflow-payload/02.b64 stockflow-payload/03.b64 stockflow-payload/04.b64 stockflow-payload/05.b64 stockflow-payload/06full.b64 stockflow-payload/07.b64 > /tmp/stockflow.zip.b64
          base64 --decode /tmp/stockflow.zip.b64 > /tmp/stockflow.zip
          unzip -t /tmp/stockflow.zip
          mkdir -p /tmp/stockflow-source
          unzip -q /tmp/stockflow.zip -d /tmp/stockflow-source
          cp -a /tmp/stockflow-source/. .
          rm -rf stockflow-payload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add StockFlow inventory management MVP"
          git push
